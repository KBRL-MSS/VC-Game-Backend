<!DOCTYPE html>
<html lang="en">
<head>
  <title>WebSocket Test</title>
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
<h1>WebSocket Test for /game</h1>
<button onclick="connect()">Connect</button>
<pre id="output"></pre>

<script>
  let stompClient = null;

  function connect() {
    const socket = new SockJS('http://localhost:8080/ws'); // endpoint from WebSocketConfig
    stompClient = Stomp.over(socket);

    stompClient.connect({}, function (frame) {
      document.getElementById("output").textContent += 'Connected: ' + frame + '\n';
      var requestBody = {}

      // test getGames
      stompClient.subscribe('/topic/get-games', function (message) {
        const body = JSON.parse(message.body);
        document.getElementById("output").textContent += 'Received: ' + JSON.stringify(body) + '\n';
      });
      stompClient.send("/app/game/get", {}, JSON.stringify(requestBody));

      // test getGameDetails
      stompClient.subscribe('/topic/game-details', function (message) {
        const body = JSON.parse(message.body);
        document.getElementById("output").textContent += 'Received: ' + JSON.stringify(body) + '\n';
      });
      requestBody = {
        "gameType": "TIC_TAC_TOE",
        "playerIds": ["1", "2"]
      }
      stompClient.send("/app/game/details", {}, JSON.stringify(requestBody));

    }, function (error) {
      console.error('STOMP connection error:', error);
    });
  }
</script>
</body>
</html>
